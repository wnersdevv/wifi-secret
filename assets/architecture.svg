<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Architecture">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      .lbl{font-family:Segoe UI,Arial,sans-serif;font-weight:700;fill:#e2e8f0}
      .sub{font-family:DejaVu Sans Mono,monospace;font-size:11px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1000" height="460" rx="18" fill="url(#abg)"/>
  <text x="30" y="42" class="lbl" font-size="20">Mimari · Discord → Core → Windows Network APIs</text>

  <!-- pipeline nodes -->
  <g filter="url(#ds)">
    <rect x="40"  y="90" width="170" height="70" rx="12" fill="#141d33" stroke="#38bdf8"/>
    <rect x="250" y="90" width="170" height="70" rx="12" fill="#141d33" stroke="#a78bfa"/>
    <rect x="460" y="90" width="170" height="70" rx="12" fill="#141d33" stroke="#f472b6"/>
    <rect x="670" y="90" width="290" height="70" rx="12" fill="#141d33" stroke="#34d399"/>
  </g>
  <text x="125" y="120" class="lbl" font-size="15" text-anchor="middle">Discord Bot</text>
  <text x="125" y="140" class="sub" text-anchor="middle">slash + prefix</text>
  <text x="335" y="120" class="lbl" font-size="15" text-anchor="middle">Auth + İzin</text>
  <text x="335" y="140" class="sub" text-anchor="middle">owner / admin / user</text>
  <text x="545" y="120" class="lbl" font-size="15" text-anchor="middle">WiFi Secret Core</text>
  <text x="545" y="140" class="sub" text-anchor="middle">cooldown · audit</text>
  <text x="815" y="120" class="lbl" font-size="15" text-anchor="middle">Windows Network APIs</text>
  <text x="815" y="140" class="sub" text-anchor="middle">netsh · WinRT · DPAPI</text>

  <!-- connectors -->
  <g stroke-width="3" fill="none">
    <path id="p1" d="M210 125 H250" stroke="#334155"/>
    <path id="p2" d="M420 125 H460" stroke="#334155"/>
    <path id="p3" d="M630 125 H670" stroke="#334155"/>
  </g>
  <g fill="#38bdf8">
    <circle r="4"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4" fill="#a78bfa"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4" fill="#f472b6"><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  </g>

  <!-- dashboard + core link -->
  <g filter="url(#ds)">
    <rect x="460" y="230" width="170" height="60" rx="12" fill="#141d33" stroke="#22d3ee"/>
  </g>
  <text x="545" y="256" class="lbl" font-size="14" text-anchor="middle">Dashboard</text>
  <text x="545" y="275" class="sub" text-anchor="middle">127.0.0.1 loopback</text>
  <path id="p4" d="M545 160 V230" stroke="#334155" stroke-width="3" fill="none"/>
  <circle r="4" fill="#22d3ee"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>

  <!-- databases -->
  <g filter="url(#ds)">
    <rect x="250" y="350" width="200" height="66" rx="12" fill="#0f2e26" stroke="#34d399"/>
    <rect x="560" y="350" width="200" height="66" rx="12" fill="#241a3a" stroke="#a78bfa"/>
  </g>
  <text x="350" y="378" class="lbl" font-size="14" text-anchor="middle">MongoDB</text>
  <text x="350" y="398" class="sub" text-anchor="middle">kalıcı: log, izin, cihaz</text>
  <text x="660" y="378" class="lbl" font-size="14" text-anchor="middle">CroxyDB</text>
  <text x="660" y="398" class="sub" text-anchor="middle">runtime: durum, session</text>

  <g stroke-width="3" fill="none">
    <path id="p5" d="M500 160 C500 300 350 300 350 350" stroke="#334155"/>
    <path id="p6" d="M590 160 C590 300 660 300 660 350" stroke="#334155"/>
  </g>
  <circle r="4" fill="#34d399"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
  <circle r="4" fill="#c4b5fd"><animateMotion dur="2.2s" begin="0.5s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>

  <rect x="1" y="1" width="998" height="458" rx="18" fill="none" stroke="#1e293b"/>
</svg>
