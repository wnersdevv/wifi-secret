<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="WiFi Secret">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#121a33"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#a78bfa;#f472b6;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#f472b6;#34d399;#a78bfa" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#34d399"><animate attributeName="stop-color" values="#34d399;#38bdf8;#a78bfa;#34d399" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="1000" height="280" rx="20" fill="url(#bg)"/>

  <g opacity="0.5">
    <circle cx="0" cy="0" r="1.6" fill="#5eead4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#7dd3fc">
    <circle cx="120" cy="60" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="70" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="210" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="220" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(150,140)">
    <ellipse cx="0" cy="0" rx="150" ry="150" fill="url(#glow)"/>
    <g fill="none" stroke-linecap="round" stroke-width="9">
      <path d="M -70 40 A 100 100 0 0 1 70 40" stroke="#334155">
        <animate attributeName="stroke" values="#334155;#38bdf8;#334155" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
      </path>
      <path d="M -46 22 A 66 66 0 0 1 46 22" stroke="#334155">
        <animate attributeName="stroke" values="#334155;#a78bfa;#334155" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </path>
      <path d="M -24 6 A 34 34 0 0 1 24 6" stroke="#334155">
        <animate attributeName="stroke" values="#334155;#34d399;#334155" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="0" cy="48" r="9" fill="#f472b6">
      <animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="330" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#title)">WiFi Secret</text>
  <text x="332" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" fill="#38bdf8" opacity="0.25" filter="url(#soft)">WiFi Secret</text>
  <text x="334" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#94a3b8">Windows Wi-Fi · Analiz · Hotspot · Yedekleme · Discord Kontrol</text>

  <g font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700">
    <rect x="334" y="188" width="118" height="30" rx="15" fill="#0f2740" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="393" y="208" fill="#7dd3fc" text-anchor="middle">Node.js 18+</text>
    <rect x="462" y="188" width="112" height="30" rx="15" fill="#241a3a" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="518" y="208" fill="#c4b5fd" text-anchor="middle">discord.js</text>
    <rect x="584" y="188" width="104" height="30" rx="15" fill="#0f2e26" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="636" y="208" fill="#6ee7b7" text-anchor="middle">MongoDB</text>
    <rect x="698" y="188" width="150" height="30" rx="15" fill="#3a1524" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="773" y="208" fill="#f9a8d4" text-anchor="middle">#powerbywnersdev</text>
  </g>

  <rect x="1" y="1" width="998" height="278" rx="20" fill="none" stroke="#1e293b"/>
  <rect x="1" y="1" width="998" height="278" rx="20" fill="none" stroke="url(#title)" stroke-width="2" stroke-dasharray="120 2432" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-2552" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
